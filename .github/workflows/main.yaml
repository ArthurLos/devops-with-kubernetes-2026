name: Release project

# Disabled after the GKE cluster/Artifact Registry/Workload Identity pool were torn
# down post-chapter-4 (cost cleanup) — chapter 5 stays on the local k3d cluster, so
# this workflow has nothing to auth/push/deploy to and would just fail on every push.
# Kept (not deleted) for history and in case GKE work resumes; manual-only for now.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west4-a
  REGISTRY: europe-west4-docker.pkg.dev
  REPOSITORY: dwk-repo
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    strategy:
      matrix:
        app:
          - name: todo-app
            context: the_project/todo-app
          - name: todo-backend
            context: the_project/todo-backend
          - name: wiki-reminder
            context: the_project/wiki-reminder
          - name: db-backup
            context: the_project/db-backup
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Configure Docker for Artifact Registry'
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: 'Form the image name'
        run: echo "IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/${{ matrix.app.name }}:$BRANCH-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: docker build --tag "$IMAGE_TAG" ${{ matrix.app.context }}

      - name: Publish
        run: docker push "$IMAGE_TAG"

  deploy:
    name: Deploy
    needs: build-publish
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: 'Determine target namespace'
        # The main branch keeps deploying to the project namespace (used since exercise
        # 2.4); every other branch gets its own namespace named after itself, i.e. its
        # own separate environment.
        run: |-
          if [ "$BRANCH" = "main" ]; then
            echo "NAMESPACE=project" >> "$GITHUB_ENV"
          else
            echo "NAMESPACE=$BRANCH" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        working-directory: the_project
        run: |-
          kubectl config set-context --current --namespace="$NAMESPACE"
          kustomize edit set namespace "$NAMESPACE"
          kustomize edit set image todo-app="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA"
          kustomize edit set image todo-backend="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA"
          kustomize edit set image wiki-reminder="$REGISTRY/$PROJECT_ID/$REPOSITORY/wiki-reminder:$BRANCH-$GITHUB_SHA"
          kustomize edit set image db-backup="$REGISTRY/$PROJECT_ID/$REPOSITORY/db-backup:$BRANCH-$GITHUB_SHA"
          kustomize build . | kubectl apply -f -
          kubectl rollout status statefulset/postgres-stset
          kubectl rollout status deployment/todo-backend
          kubectl rollout status deployment/todo-app
          kubectl get ingress -o wide
