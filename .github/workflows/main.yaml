name: Release project

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-west4-a
  REGISTRY: europe-west4-docker.pkg.dev
  REPOSITORY: dwk-repo
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    strategy:
      matrix:
        app:
          - name: todo-app
            context: the_project/todo-app
          - name: todo-backend
            context: the_project/todo-backend
          - name: wiki-reminder
            context: the_project/wiki-reminder
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Configure Docker for Artifact Registry'
        run: gcloud --quiet auth configure-docker "$REGISTRY"

      - name: 'Form the image name'
        run: echo "IMAGE_TAG=$REGISTRY/$PROJECT_ID/$REPOSITORY/${{ matrix.app.name }}:$BRANCH-$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: docker build --tag "$IMAGE_TAG" ${{ matrix.app.context }}

      - name: Publish
        run: docker push "$IMAGE_TAG"

  deploy:
    name: Deploy
    needs: build-publish
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        working-directory: the_project
        run: |-
          kustomize edit set image todo-app="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-app:$BRANCH-$GITHUB_SHA"
          kustomize edit set image todo-backend="$REGISTRY/$PROJECT_ID/$REPOSITORY/todo-backend:$BRANCH-$GITHUB_SHA"
          kustomize edit set image wiki-reminder="$REGISTRY/$PROJECT_ID/$REPOSITORY/wiki-reminder:$BRANCH-$GITHUB_SHA"
          kustomize build . | kubectl apply -f -
          kubectl rollout status statefulset/postgres-stset -n project
          kubectl rollout status deployment/todo-backend -n project
          kubectl rollout status deployment/todo-app -n project
          kubectl get ingress -n project -o wide
