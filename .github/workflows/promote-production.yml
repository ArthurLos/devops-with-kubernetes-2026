name: Promote to production

# Exercise 4.9: "each tagged commit results in deployment to the production
# environment". Pushing a v* tag (e.g. v1.0.0 - a convention of its own,
# deliberately distinct from this repo's course-exercise tags like 4.9, which
# are never reused/moved per AGENTS.md) is what "cuts a release": this workflow
# fast-forwards the production branch to that exact commit. the_project's
# ArgoCD Application for production (../../the_project/argocd-application-production.yaml)
# tracks that branch and picks up the move on its own - same automated-sync
# mechanism as every other Application in this repo.
#
# No cloud credentials needed at all - this is a plain git operation against
# GitHub itself, so it's safe to leave on a real, automatic trigger even while
# chapter 5 otherwise stays off GKE (see main.yaml/delete-environment.yaml's
# own comments for why those two are disabled).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fast-forward production to this tag
        run: git push origin "${{ github.sha }}:refs/heads/production" --force
