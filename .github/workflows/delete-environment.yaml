name: Delete branch environment

# Disabled for the same reason as main.yaml (see its comment) — no GKE cluster to
# delete a namespace from right now.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  delete-environment:
    name: Delete environment
    # Only act on an actual branch delete, and never on 'main' (that's the project
    # namespace, not a per-branch one — GitHub won't let you delete the default
    # branch anyway, but this is a cheap extra guard).
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest
    environment: GKE_PROJECT
    env:
      GKE_CLUSTER: dwk-cluster
      GKE_ZONE: europe-west4-a
      NAMESPACE: ${{ github.event.ref }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ secrets.GKE_PROJECT }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Delete namespace
        # $NAMESPACE comes from the env: block above, not interpolated directly into
        # this script by the Actions templating engine — avoids a shell-injection risk
        # from a maliciously-named branch, even though only repo collaborators can
        # create/delete branches here.
        run: kubectl delete namespace "$NAMESPACE" --ignore-not-found
