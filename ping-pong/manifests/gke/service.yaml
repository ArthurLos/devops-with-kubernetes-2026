apiVersion: v1
kind: Service
metadata:
  name: ping-pong-svc
  namespace: exercises
spec:
  # ClusterIP again as of exercise 3.3: unlike Ingress, the Gateway API's HTTPRoute
  # targets a regular ClusterIP Service directly, no NodePort needed.
  type: ClusterIP
  selector:
    app: ping-pong
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
