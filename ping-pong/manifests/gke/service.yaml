apiVersion: v1
kind: Service
metadata:
  name: ping-pong-svc
  namespace: exercises
spec:
  # NodePort, not LoadBalancer: GKE's Ingress (exercise 3.2) requires a NodePort backend
  # Service — it doesn't expose NodePort externally itself, the Ingress's load balancer does.
  type: NodePort
  selector:
    app: ping-pong
  ports:
    - port: 3000
      protocol: TCP
      targetPort: 3000
