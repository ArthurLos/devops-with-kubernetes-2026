apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broadcaster
  template:
    metadata:
      labels:
        app: broadcaster
    spec:
      containers:
        - name: broadcaster
          image: broadcaster:1.1.0
          imagePullPolicy: IfNotPresent
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: PORT
              value: "3000"
            - name: NATS_URL
              value: nats://my-nats.nats.svc.cluster.local:4222
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Exercise 4.9: safe-by-default - log only, no WEBHOOK_URL/Secret needed
            # at all. ../../overlays/production/patch-broadcaster-webhook.yaml flips
            # this to "false" and adds WEBHOOK_URL for production only; staging keeps
            # this base as-is, per the exercise's "staging just logs, doesn't forward".
            - name: LOG_ONLY
              value: "true"
