# Flips the broadcaster's safe-by-default LOG_ONLY (see ../../broadcaster/manifests/deployment.yaml)
# back to actually forwarding, for production only. WEBHOOK_URL's Secret
# (broadcaster-webhook) is applied by hand in the production namespace - see root
# README's "Exercise 4.9" section - never through ArgoCD/Kustomize.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: broadcaster
spec:
  template:
    spec:
      containers:
        - name: broadcaster
          env:
            - name: LOG_ONLY
              value: "false"
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: broadcaster-webhook
                  key: WEBHOOK_URL
