# Replaces the retired project namespace's manifests/gateway.yaml - same shape,
# now owned by production instead (see root README's "Local cluster note" for why
# this attaches to the shared Gateway instead of having its own).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: production-route
spec:
  parentRefs:
    - name: my-gateway
      namespace: exercises
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /todos
      backendRefs:
        - name: todo-backend-svc
          port: 2345
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: todo-app-svc
          port: 3000
