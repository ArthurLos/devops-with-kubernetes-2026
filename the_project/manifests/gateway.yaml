apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: project-route
  namespace: project
spec:
  # Attaches to the shared Gateway in the exercises namespace (see
  # ../../manifests/gateway.yaml) instead of having its own — k3d's ServiceLB can only
  # bind one Gateway's LoadBalancer Service to host port 80.
  parentRefs:
    - name: my-gateway
      namespace: exercises
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /todos
      backendRefs:
        - name: todo-backend-svc
          port: 2345
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: todo-app-svc
          port: 3000
