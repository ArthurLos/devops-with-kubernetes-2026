apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-app-images
          persistentVolumeClaim:
            claimName: todo-app-pvc
      containers:
        - name: todo-app
          image: todo-app:1.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - name: todo-app-images
              mountPath: /usr/src/app/images
