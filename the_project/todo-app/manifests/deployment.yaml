apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
  namespace: project
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate: todo-app-pvc is ReadWriteOnce (a GKE Persistent
  # Disk only supports single-node attachment). RollingUpdate would try to start the new pod
  # — possibly on a different node — before the old one releases the volume, and get stuck.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: todo-app-images
          persistentVolumeClaim:
            claimName: todo-app-pvc
      containers:
        - name: todo-app
          image: todo-app:1.6.1
          imagePullPolicy: IfNotPresent
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            httpGet:
              path: /ready
              port: 3000
          livenessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: 3000
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: todo-app-config
          volumeMounts:
            - name: todo-app-images
              mountPath: /usr/src/app/images
