apiVersion: v1
kind: Service
metadata:
  name: todo-app-svc
  namespace: project
spec:
  # NodePort, not ClusterIP: GKE's Ingress controller requires a NodePort backend Service
  # (it doesn't expose the NodePort externally itself, the Ingress's load balancer does).
  type: NodePort
  selector:
    app: todo-app
  ports:
    - port: 3000
      targetPort: 3000
