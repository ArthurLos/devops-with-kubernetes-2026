# Exercise 4.8: GitOps bootstrap for the_project.
#
# Kept outside every app's own manifests/ (and outside this folder's existing
# kustomization.yaml, which is GKE-specific: Artifact Registry images, gke/
# variants of a few manifests — not relevant now that chapter 4's GKE cluster
# is torn down and chapter 5 stays local). Applied once, manually, directly
# into the argocd namespace to register the whole project with ArgoCD:
#
#   kubectl apply -f the_project/argocd-application.yaml
#
# Uses a multi-source Application (ArgoCD 2.6+) instead of one Kustomize/
# directory source, since the project's manifests are spread across each
# microservice's own manifests/ folder rather than collected in one place.
# Each source below is a plain directory of manifests (non-recursive, so
# every service's manifests/gke/ subfolder is correctly ignored) for exactly
# what's already running on this local cluster. db-backup is deliberately
# left out: it only makes sense against a real GCS bucket/service-account key
# (see db-backup/README.md) and was never deployed locally even before
# GitOps — nothing changes there.
#
# From then on ArgoCD polls this repo's main branch (default ~180s) and
# applies these into the project namespace automatically: prune removes
# anything deleted from git, selfHeal reverts manual kubectl drift back to
# match git. No kubectl apply needed for day-to-day changes anymore — commit
# and push to main, ArgoCD does the rest (per the exercise: "enough that the
# main branch is deployed to cluster").
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-project
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/ArthurLos/devops-with-kubernetes-2026.git
      targetRevision: main
      path: the_project/manifests
    - repoURL: https://github.com/ArthurLos/devops-with-kubernetes-2026.git
      targetRevision: main
      path: the_project/todo-backend/manifests
    - repoURL: https://github.com/ArthurLos/devops-with-kubernetes-2026.git
      targetRevision: main
      path: the_project/todo-app/manifests
      directory:
        # ingress.yaml is obsolete locally (replaced by the Gateway API
        # HTTPRoute in the_project/manifests/gateway.yaml — see root README's
        # "Local cluster note"), kept only for historical exercise tags.
        exclude: ingress.yaml
    - repoURL: https://github.com/ArthurLos/devops-with-kubernetes-2026.git
      targetRevision: main
      path: the_project/wiki-reminder/manifests
    - repoURL: https://github.com/ArthurLos/devops-with-kubernetes-2026.git
      targetRevision: main
      path: the_project/broadcaster/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: project
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
