# Exercise 4.9: production environment. Applied once, manually:
#
#   kubectl apply -f the_project/argocd-application-production.yaml
#
# Deliberately tracks the "production" branch, NOT main and NOT this repo's own
# exercise-numbered git tags (1.1, 4.9, ... - those are course submission markers,
# never reused/moved per AGENTS.md, and have nothing to do with this app's
# releases). Instead: .github/workflows/promote-production.yml auto-triggers on
# any push of a v* tag (its own, separate convention, e.g. v1.0.0) and
# fast-forwards the production branch to that exact commit - entirely local git
# operations, no cloud credentials needed. ArgoCD then picks up the moved branch
# on its own, same automated-sync mechanism as every other Application here. That
# chain is "each tagged commit results in deployment to the production
# environment" - see root README's "Exercise 4.9" section for the full picture
# and a live test.
#
# Secrets (postgres-credentials, broadcaster-webhook) are applied by hand in the
# production namespace ahead of time, per the exercise - never part of this sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: the-project-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ArthurLos/devops-with-kubernetes-2026.git
    targetRevision: production
    path: the_project/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
