apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
  namespace: exercises
spec:
  # ClusterIP again as of exercise 3.3: unlike Ingress, the Gateway API's HTTPRoute
  # targets a regular ClusterIP Service directly, no NodePort needed.
  type: ClusterIP
  selector:
    app: log-output
  ports:
    - port: 2345
      targetPort: 3000
