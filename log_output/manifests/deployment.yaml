apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-status
          emptyDir: {}
      containers:
        - name: writer
          image: log-output-writer:1.0.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: shared-status
              mountPath: /usr/src/app/shared
        - name: reader
          image: log-output-reader:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: shared-status
              mountPath: /usr/src/app/shared
