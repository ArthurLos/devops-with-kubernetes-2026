apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: exercises
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          # Shared across namespaces: k3d's ServiceLB can only bind one Gateway's
          # LoadBalancer Service to host port 80, so the_project's HTTPRoute (see
          # ../the_project/manifests/gateway.yaml) attaches to this same Gateway
          # instead of having its own.
          from: All
        kinds:
          - kind: HTTPRoute
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: log-output-pingpong-route
  namespace: exercises
spec:
  parentRefs:
    - name: my-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pingpong
      # ping-pong responds on / (exercise 3.4) — rewrite the path here instead of
      # making the app aware of this cluster-level URL structure.
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: ping-pong-svc
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /status
      backendRefs:
        - name: log-output-svc
          port: 2345
